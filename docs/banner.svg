<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="plan-live: your markdown plan, live and reviewable">
  <defs>
    <linearGradient id="word" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#c9c2ff"/>
      <stop offset="1" stop-color="#ff9bd5"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#8b7bff"/>
      <stop offset=".5" stop-color="#47d7ff"/>
      <stop offset="1" stop-color="#3ee0a7"/>
    </linearGradient>
    <radialGradient id="g1" cx="18%" cy="30%" r="50%"><stop offset="0" stop-color="#5b4bff" stop-opacity=".75"/><stop offset="1" stop-color="#5b4bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="72%" cy="8%" r="45%"><stop offset="0" stop-color="#ff4fb0" stop-opacity=".55"/><stop offset="1" stop-color="#ff4fb0" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3" cx="95%" cy="75%" r="40%"><stop offset="0" stop-color="#00c2ff" stop-opacity=".5"/><stop offset="1" stop-color="#00c2ff" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".07"/></pattern>
    <clipPath id="round"><rect width="1280" height="340" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1280" height="340" fill="#0b0b14"/>
    <rect width="1280" height="340" fill="url(#g1)"/>
    <rect width="1280" height="340" fill="url(#g2)"/>
    <rect width="1280" height="340" fill="url(#g3)"/>
    <rect width="1280" height="340" fill="url(#dots)"/>
    <g transform="translate(96 82)">
      <circle cx="88" cy="88" r="76" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="16"/>
      <circle cx="88" cy="88" r="76" fill="none" stroke="url(#ring)" stroke-width="16" stroke-linecap="round" stroke-dasharray="334 477" transform="rotate(-90 88 88)"/>
      <text x="88" y="100" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#ecebff">70%</text>
    </g>
    <text x="330" y="168" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-3" fill="url(#word)">plan-live</text>
    <text x="334" y="214" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#c3c1e0">Your markdown plan, live, visual and reviewable with Claude.</text>
    <g font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="16" font-weight="600">
      <g transform="translate(334 244)"><rect width="104" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".16"/><circle cx="20" cy="17" r="5" fill="#3ee0a7"/><text x="34" y="22" fill="#ecebff">live</text></g>
      <g transform="translate(450 244)"><rect width="132" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".16"/><circle cx="20" cy="17" r="5" fill="#ff7ac6"/><text x="34" y="22" fill="#ecebff">two-way</text></g>
      <g transform="translate(594 244)"><rect width="150" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".16"/><circle cx="20" cy="17" r="5" fill="#8b7bff"/><text x="34" y="22" fill="#ecebff">local-only</text></g>
    </g>
  </g>
</svg>
